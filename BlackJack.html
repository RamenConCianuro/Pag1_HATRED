<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super 21 | Esquilax Bet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="Css/Super21.css">
    <script src="Js/Super21.js" defer></script>
</head>
<body class="d-flex flex-column">
    <div class="barra">
        <div class="container py-3 d-flex flex-wrap align-items-center justify-content-center justify-content-md-between gap-3">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-outline-dorado boton-icono" aria-label="Inicio">
                    <img src="Imagenes/house-door-fill.svg" width="22" height="22" alt="">
                </a>
                <a href="index.html" class="Esquilax">Esquilax Bet</a>
            </div>

            <div class="izquierda d-flex flex-wrap align-items-center justify-content-center gap-2">
                <a href="Login.html" id="Login" class="btn btn-outline-dorado">Login</a>
                <a href="SignIn.html" id="SignIn" class="btn btn-dorado">Sign In</a>
                <a href="Login.html"
                id="Cuenta"
                class="btn btn-outline-dorado boton-icono rounded-circle"
                aria-label="Iniciar sesión">
                    <img src="Imagenes/person-circle.svg" width="26" height="26" alt="">
                </a>
            </div>
        </div>
    </div>

    <div class="container flex-grow-1 py-4 py-md-5">
        <div class="text-center mb-4">
            <p class="texto-dorado small text-uppercase fw-semibold mb-2">Blackjack</p>
            <h1 class="titulo mb-0">Super 21</h1>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9">
                <div class="mesa rounded-4 p-3 p-sm-4 p-md-5">
                    <div class="zona-mano text-center pb-4">
                        <h2 class="h5 mb-3">Dealer: <span id="dealer-sum" class="puntuacion"></span></h2>
                        <div id="dealer-cards" class="cartas"></div>
                    </div>

                    <div class="zona-mano zona-jugador text-center pt-4">
                        <h2 class="h5 mb-3">Jugador: <span id="player-sum" class="puntuacion"></span></h2>
                        <div id="player-cards" class="cartas"></div>
                    </div>

                    <div class="d-flex flex-wrap justify-content-center gap-3 mt-4">
                        <button id="pedir" class="btn btn-dorado btn-lg">Pedir</button>
                        <button id="plantar" class="btn btn-outline-dorado btn-lg">Plantar</button>
                    </div>
                    <p id="resultadoss" class="text-center mb-0" aria-live="polite"></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
