<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Esquilax Bet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="Css/Sesion.css">
    <style>[x-cloak] { display: none !important; }</style>
    <script src="Js/Login.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="d-flex flex-column">
    <div class="barra">
        <div class="container py-3 d-flex flex-wrap align-items-center justify-content-center justify-content-md-between gap-3">
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-outline-dorado boton-icono" aria-label="Inicio">
                    <img src="Imagenes/house-door-fill.svg" width="22" height="22" alt="">
                </a>
                <a href="index.html" id="Esquilax" class="marca">Esquilax Bet</a>
            </div>
            <div class="d-flex flex-wrap align-items-center justify-content-center gap-2">
                <a href="Login.html" class="btn btn-outline-dorado" aria-current="page">Iniciar sesión</a>
                <a href="SignIn.html" class="btn btn-dorado">Crear cuenta</a>
                <a href="Login.html" class="btn btn-outline-dorado boton-icono rounded-circle" aria-label="Iniciar sesión en tu cuenta">
                    <img src="Imagenes/person-circle.svg" width="26" height="26" alt="">
                </a>
            </div>
        </div>
    </div>

    <div class="container flex-grow-1 d-flex align-items-center justify-content-center py-4 py-md-5">
        <div class="cuadro rounded-4 p-4 p-sm-5" x-data="login()" x-init="cargarCuentas()">
            <div class="text-center mb-4">
                <p class="texto-dorado small text-uppercase fw-semibold mb-2">Esquilax Bet</p>
                <h1 class="titulo-sesion mb-3">Iniciar sesión</h1>
                <p id="descripcion" class="texto-suave small mb-0">Ingresa tu usuario y contraseña para acceder a tu cuenta.</p>
            </div>
            <form id="InicioSesion" @submit.prevent="iniciarSesion()">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" id="usuario" name="usuario" class="form-control" autocomplete="username" x-model="usuario">
                </div>
                <div class="mb-4">
                    <label for="contraseña" class="form-label">Contraseña</label>
                    <input type="password" id="contraseña" name="contraseña" class="form-control" autocomplete="current-password" x-model="clave">
                </div>
                <input type="submit" class="btn btn-dorado btn-lg w-100" value="Iniciar sesión" :disabled="cargando">
                <p class="texto-suave small text-center mt-3 mb-0" x-show="cargando" x-cloak>Cargando cuentas...</p>
                <p class="text-danger text-center mt-3 mb-0" x-show="mensaje !== ''" x-text="mensaje" x-cloak></p>
            </form>
            <p class="texto-suave small text-center mt-4 mb-0">¿No tienes cuenta? <a href="SignIn.html" class="enlace-sesion">Crear cuenta</a></p>
        </div>
    </div>
    <div class="pie py-3 text-center">
        <div class="container texto-suave small">Esquilax Bet · Proyecto universitario · Demostración</div>
    </div>
</body>
</html>
