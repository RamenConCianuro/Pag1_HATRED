<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="Css/Sesion.css">
</head>

<body>
    
    <button id="Esquilax" class="Esquilax">
        <h1>Esquilax Bet</h1> <br>
    </button>
    
    <p id="descripcion">
        Crea una cuenta para poder ingresar fondos. Recuerda que, al tratarse de una página que gestiona dinero, debes cumplir con los requisitos legales de mayoría de edad.
    </p>

    <div class="cuadro">
        <p>Iniciar Sesion</p>
        <form id="InicioSesion">
            <label for="usuario">Correo</label> 
            <input type="text" id="usuario" name="usuario" required><br>
            <label for="contraseña">Contraseña</label>
            <input type="password" id="contraseña" name="contraseña" required><br><br>
            <input type="submit" value="Iniciar Sesion"> 
        </form>
    </div>
    <script src="Js/Sesion.js"></script>
</body>
</html>
